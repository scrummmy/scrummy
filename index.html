    <!--
      Google Consent Mode v2 default: storage stays denied until the cookie banner records a
      choice (see src/stores/consent.ts). Must run before gtag.js loads so GA never sets
      identifiers ahead of consent. Page views are sent manually from the router
      (send_page_view: false) since this is an SPA.

      GA is entirely optional: without VITE_GA_MEASUREMENT_ID set at build time (see
      .env.example), the %-placeholder below is left un-replaced by Vite, so gaId stays
      un-configured and gtag.js never loads — dataLayer.push calls elsewhere just no-op.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
      });

      var gaId = "%VITE_GA_MEASUREMENT_ID%";
      if (gaId.indexOf("%") === -1 && gaId.length > 0) {
        gtag("js", new Date());
        gtag("config", gaId, { send_page_view: false });
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(gaId);
        document.head.appendChild(gaScript);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
